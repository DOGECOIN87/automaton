# Automaton (Solana-only) — first-deployment compose stack
#
# PREPARE ONLY. See DEPLOY.md for the full first-deployment runbook.
# Copy .env.example → .env and fill in values before `docker compose up`.
#
# Wallet key custody: the automaton's Solana keypair lives in
# ~/.automaton/wallet.json (mode 0600). It is generated by the setup wizard
# on first run INSIDE the container and persisted in the named volume
# `automaton-data`. Back it up before funding the wallet with anything real.

services:
  automaton:
    build: .
    image: automaton-solana:0.3.0
    container_name: automaton
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Where the SQLite DB + wallet.json live. Override the entrypoint for
      # one-off commands, e.g. re-running the wizard:
      #   docker compose run --rm automaton node dist/index.js --setup
      AUTOMATON_DATA_DIR: /data
    ports:
      # GUI dashboard
      - "${GUI_PORT:-8787}:8787"
    volumes:
      - automaton-data:/data
      # Funding wallet keypair (generated during deploy prep, 0600, gitignored).
      # Mounted read-only; the runtime signs child-funding transfers with it.
      # Alternative: set FUNDING_WALLET_SECRET in .env instead of this mount.
      - ./deploy/funding-wallet.json:/app/deploy/funding-wallet.json:ro
    # Required for the interactive setup wizard on first boot:
    #   docker compose run --rm automaton node dist/index.js --setup
    # then start detached:
    #   docker compose up -d

volumes:
  automaton-data:
    name: automaton-data
